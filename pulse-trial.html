<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>見比べ見本：たたく間の拍のカウント（2026-11-11）</title>
<!-- 本番と同じ css・js を読み込む。app.js だけは読み込まず、下の script で拍の鳴らし方を4案に切り替える -->
<link rel="stylesheet" href="css/style.css">
<style>
#sbar{position:fixed;left:0;right:0;top:0;background:#fff;border-bottom:3px solid #1F2A44;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;z-index:50;font-weight:800;font-size:17px}
#sbar .tab{white-space:nowrap;font-family:inherit;font-weight:800;font-size:17px;padding:8px 14px;border-radius:999px;border:3px solid #1F2A44;background:#fff}
#sbar .tab.on{background:#FFC93C}
#sdesc{font-weight:500;font-size:14px;line-height:1.35;flex:1 1 300px}
@media (max-width:700px){#sbar .tab{font-size:14px;padding:6px 10px}}

/* 右上：進み具合とはやさをまとめる */
.rhythm-right{display:flex;align-items:center;gap:20px}
/* 結果のあとのボタン（案B）・とめるボタン（案C） */
.flow-btn{position:absolute;left:768px;height:80px;padding:0 32px;border-radius:999px;border:4px solid #1F2A44;background:#fff;font-size:26px;font-weight:800;color:#1F2A44;display:flex;align-items:center;gap:10px;white-space:nowrap}
.flow-btn.main{background:#FFC93C}
.flow-btn[hidden]{display:none}
#flow-btn-1{top:70px}
#flow-btn-2{top:170px}
/* 見本だけのまとめ（本番はクリア画面 案C） */
#sum{position:absolute;inset:0;background:rgba(36,48,90,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:20}
#sum[hidden]{display:none}
#sum .big{font-size:60px;font-weight:800}
#sum .sm{font-size:24px;font-weight:800}
#sum .row{display:flex;gap:18px}
#sum .q{width:84px;height:84px;border-radius:99px;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
#cover{position:absolute;inset:0;background:rgba(226,244,216,.9);display:flex;align-items:center;justify-content:center;z-index:30}
#cover[hidden]{display:none}
.lead-num{font-size:44px;margin-left:14px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
    <symbol id="glyph-ta" viewBox="0 0 180 549">
      <path fill="currentColor" d="M143 0H180V415Q180 475 144 512Q109 549 56 549Q28 549 14 536Q0 522 0 500Q0 474 14 453Q28 432 51 419Q74 406 99 406Q121 406 143 415Z"/>
    </symbol>
    <symbol id="glyph-titi" viewBox="0 0 484 587">
      <path fill="currentColor" d="M448 115 179 80V409Q179 466 146 504Q112 542 56 542Q0 542 0 494Q0 470 13 448Q26 427 48 414Q70 400 96 400Q121 400 143 409V0L484 45V453Q484 494 466 524Q448 555 420 571Q393 587 362 587Q306 587 306 538Q306 498 336 471Q366 444 404 444Q427 444 448 453Z"/>
    </symbol>
    <symbol id="glyph-un" viewBox="0 0 256 755">
      <path fill="currentColor" d="M96 0 256 195Q206 254 179 297Q152 340 152 384Q152 421 176 461.5Q200 502 252 564L236 586Q192 558 154 558Q126 558 112 576.5Q98 595 98 621Q98 653 111.5 681.5Q125 710 148 736L135 755Q66 705 33 664Q0 623 0 575Q0 532 27 512Q54 492 92 492Q122 492 170 515V513L16 308Q117 219 117 142Q117 81 53 0Z"/>
    </symbol>
    <symbol id="glyph-taan" viewBox="0 0 297 1010">
      <path fill="currentColor" d="M273 0H297V840Q297 872 280.5 902.5Q264 933 236 957Q208 981 175 995.5Q142 1010 109 1010Q61 1010 30.5 987.5Q0 965 0 919Q0 868 28.5 827.5Q57 787 103 763.5Q149 740 201 740Q245 740 273 762ZM27 943Q27 953 34.5 961Q42 969 55 969Q90 969 142 940Q177 920 205.5 895.5Q234 871 251 846.5Q268 822 268 805Q268 794 262.5 786.5Q257 779 243 779Q224 779 197 791Q170 803 140.5 822Q111 841 85 863.5Q59 886 43 907Q27 928 27 943Z"/>
    </symbol>
  </svg>
<div id="sbar">
  <button type="button" class="tab" data-v="now">いま（無音）</button>
  <button type="button" class="tab" data-v="A">案A 同じ大きさ</button>
  <button type="button" class="tab" data-v="B">案B 半分の大きさ（おすすめ）</button>
  <button type="button" class="tab" data-v="C">案C 案B＋お手本の間も</button>
  <div id="sdesc"></div>
</div>
<div id="stage">
  <section id="screen-rhythm" class="screen active">
    <div class="quiz-header">
      <button type="button" class="quiz-map-btn"><span>ちずへ</span></button>
      <h2 class="quiz-title">リズムの森</h2>
      <div class="rhythm-right">
        <div class="quiz-progress"><div id="quiz-dots" class="quiz-dots"></div><span id="quiz-progress-text" class="quiz-progress-text"></span></div>
        <button type="button" id="btn-rhythm-speed" class="rhythm-speed-btn"></button>
      </div>
    </div>
    <p id="rhythm-lead" class="rhythm-lead"></p>
    <div id="rhythm-cards" class="rhythm-cards"></div>
    <div id="rhythm-dots" class="rhythm-dots"></div>
    <div class="rhythm-controls">
      <button type="button" id="btn-rhythm-model" class="rhythm-model-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F2A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <span>おてほん</span>
      </button>
      <div class="rhythm-don-wrap">
        <button type="button" id="btn-rhythm-don" class="rhythm-don-btn">ドン！</button>
        <div id="rhythm-bubble" class="rhythm-bubble" hidden></div>
      </div>
      <button type="button" id="flow-btn-1" class="flow-btn main" hidden></button>
    </div>
    <div id="cover"><button type="button" id="btn-cover" class="flow-btn main" style="position:static;height:96px;font-size:32px">はじめる（音が でます）</button></div>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/texts.js"></script>
<script src="js/music.js"></script>
<script src="js/rhythm.js"></script>
<script src="js/audio.js"></script>
<script>
(function () {
  // 見本の問題（レベル3 の表から休符が多いものを含めて5つ）
  var PATTERNS = [
    ["ta", "un", "ta", "un"],
    ["ta", "titi", "un", "ta"],
    ["ta", "un", "un", "titi"],
    ["ta", "taan", "un"],
    ["ta", "titi", "titi", "un"]
  ];
  var GLYPH_W = { ta: 34, titi: 86, un: 35, taan: 31 };
  var LABEL = { ta: "タン", titi: "タタ", un: "ウン", taan: "ターアン" };
  var RESULT_TEXT = { pittari: "ぴったり！", oshii: "おしい！", retry: "もういちど" };
  var SPEED_ORDER = ["slow", "normal", "fast"];
  var SPEED_TEXT = { slow: "ゆっくり", normal: "ふつう", fast: "はやい" };
  // 拍の音の大きさ（ピアノの音の 1.0 ＝ 今のカウントと同じ）
  var V = {
    now: { tap: 0,   model: 0,   num: false },
    A:   { tap: 1.0, model: 0,   num: true },
    B:   { tap: 0.5, model: 0,   num: true },
    C:   { tap: 0.5, model: 0.5, num: true }
  };
  var DESC = {
    now: "いまの本番と同じ。カウント「1・2・3・4」のあと、たたく4拍は無音。",
    A: "たたく4拍も、カウントと同じ「ピッ・ポッ・ポッ・ポッ」を同じ大きさで鳴らす。画面に「たたいて！」と拍の数字 1〜4。",
    B: "案A と同じだが、たたく間の拍の音は半分の大きさ。子どもの「ドン！」の音が聞き取りやすい。",
    C: "案B に加えて、お手本の4拍にも拍の音を半分の大きさで重ねる。最初から最後まで拍が続く。"
  };

  var variant = "B", speedKey = "slow", qIndex = 0;
  var state = "waiting", rafId = null, autoId = null, dotTimers = [], btnTimer = null;
  var cardEls = [], dotEls = [], pattern = PATTERNS[0];
  var bpm = 60, beatSec = 1, lat = 0, base = 0, start = 0, modelTl = null, queue = [], taps = [];
  var tctx = null, tmaster = null, tickNodes = [], lastCorrectKey = null;
  var $ = function (id) { return document.getElementById(id); };

  // 上の案のボタンの高さ（画面の幅で折り返して変わる）を除いた場所に、画面全体を縮めて置く
  function scaleStage() {
    var h = $("sbar").offsetHeight;
    var s = Math.min(window.innerWidth / 1194, (window.innerHeight - h) / 834);
    $("stage").style.top = (h + (window.innerHeight - h) / 2) + "px";
    $("stage").style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  function bind(id, fn) { $(id).addEventListener("pointerup", function (e) { if (e.button === undefined || e.button === 0) { fn(e); } }); }
  function restartClass(el, cls) { el.classList.remove(cls); el.getBoundingClientRect(); el.classList.add(cls); }
  function setLead(t, isCount, num) {
    var el = $("rhythm-lead");
    var html = num ? t + '<span class="lead-num">' + num + "</span>" : t;
    if (el.innerHTML !== html) { el.innerHTML = html; }
    el.classList.toggle("count", !!isCount);
  }
  function setActive(i) { for (var k = 0; k < cardEls.length; k++) { cardEls[k].classList.toggle("active", k === i); } }
  function resetDots() { for (var k = 0; k < dotEls.length; k++) { dotEls[k].className = "rhythm-dot"; } }
  function hideBubble() { var b = $("rhythm-bubble"); b.hidden = true; b.classList.remove("pop"); b.textContent = ""; }

  // 拍の音：本番の audio.js の schedulePianoNote と同じ作り（三角波＋2倍の正弦波 0.25、0.005秒で 0.5、長さ 0.1秒＋0.6秒で消える）に音量の倍率 vol を掛ける
  function tick(freq, when, vol) {
    if (!tctx || vol <= 0) { return; }
    var t = Math.max(when, tctx.currentTime), end = t + 0.1 + 0.6;
    var env = tctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.5 * vol, t + 0.005);
    env.gain.exponentialRampToValueAtTime(0.001 * vol, end);
    env.connect(tmaster);
    var o1 = tctx.createOscillator(), g1 = tctx.createGain();
    o1.type = "triangle"; o1.frequency.setValueAtTime(freq, t); g1.gain.setValueAtTime(1.0, t); o1.connect(g1); g1.connect(env);
    var o2 = tctx.createOscillator(), g2 = tctx.createGain();
    o2.type = "sine"; o2.frequency.setValueAtTime(freq * 2, t); g2.gain.setValueAtTime(0.25, t); o2.connect(g2); g2.connect(env);
    o1.start(t); o2.start(t); o1.stop(end); o2.stop(end);
    tickNodes.push(o1, o2, env);
  }
  function stopTicks() {
    for (var i = 0; i < tickNodes.length; i++) { try { if (tickNodes[i].stop) { tickNodes[i].stop(0); } tickNodes[i].disconnect(); } catch (e) {} }
    tickNodes = [];
  }

  function stopRound() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    if (autoId !== null) { clearTimeout(autoId); autoId = null; }
    if (btnTimer !== null) { clearTimeout(btnTimer); btnTimer = null; }
    for (var i = 0; i < dotTimers.length; i++) { clearTimeout(dotTimers[i]); }
    dotTimers = []; queue = []; taps = []; state = "waiting";
    stopTicks();
    setActive(-1); setLead("おなじ リズムで たたこう！", false); hideBubble(); resetDots(); $("flow-btn-1").hidden = true;
  }

  function renderPattern() {
    pattern = PATTERNS[qIndex];
    var cc = $("rhythm-cards"), dc = $("rhythm-dots");
    cardEls = []; dotEls = []; cc.innerHTML = ""; dc.innerHTML = "";
    for (var i = 0; i < pattern.length; i++) {
      var id = pattern[i], wide = id === "taan";
      var c = document.createElement("div");
      c.className = wide ? "rhythm-card wide" : "rhythm-card";
      c.innerHTML = '<svg width="' + GLYPH_W[id] + '" height="104" aria-hidden="true"><use href="#glyph-' + id + '"/></svg><span class="rhythm-card-label">' + LABEL[id] + "</span>";
      cc.appendChild(c); cardEls.push(c);
      var col = document.createElement("div");
      col.className = wide ? "rhythm-dot-col wide" : "rhythm-dot-col";
      for (var k = 0; k < ONPU.rhythm.CARDS[id].hits.length; k++) { var dt = document.createElement("div"); dt.className = "rhythm-dot"; col.appendChild(dt); dotEls.push(dt); }
      dc.appendChild(col);
    }
    var d = $("quiz-dots"); d.innerHTML = "";
    for (var j = 0; j < PATTERNS.length; j++) { var e = document.createElement("div"); e.className = j <= qIndex ? "quiz-dot filled" : "quiz-dot"; d.appendChild(e); }
    $("quiz-progress-text").textContent = (qIndex + 1) + " / " + PATTERNS.length;
  }

  function scheduleDue(now) {
    for (var i = 0; i < queue.length; i++) {
      var ev = queue[i];
      if (!ev.done && ev.time <= now + 0.15) { ev.done = true; ONPU.audio.playDrum(ev.time); }
    }
  }

  function finishRound() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    state = "result"; setActive(-1); setLead("おなじ リズムで たたこう！", false); resetDots();
    var w = ONPU.config.rhythmWindow || { perfect: 0.15, good: 0.30 };
    var res = ONPU.rhythm.judge(pattern, bpm, taps, { perfect: w.perfect, good: w.good, offset: lat });
    if (!res) { return; }
    for (var i = 0; i < res.notes.length; i++) {
      (function (idx, grade) {
        var f = function () { var d = dotEls[idx]; if (d) { d.className = "rhythm-dot " + grade; restartClass(d, "pop"); } };
        if (idx === 0) { f(); } else { dotTimers.push(setTimeout(f, idx * 120)); }
      })(i, res.notes[i].grade);
    }
    var b = $("rhythm-bubble"); b.textContent = RESULT_TEXT[res.result]; b.hidden = false; restartClass(b, "pop");
    if (res.result === "pittari") { var key = ONPU.music.pickCorrectKey(lastCorrectKey); ONPU.audio.playMelody(key); lastCorrectKey = key; }
    window.__last = res.result;
    btnTimer = setTimeout(function () {
      btnTimer = null;
      var b1 = $("flow-btn-1");
      b1.innerHTML = 'つぎへ<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F2A44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
      b1.hidden = false;
    }, 600);
  }

  function tick2() {
    rafId = null;
    var now = ONPU.audio.now();
    if (now === null) { stopRound(); return; }
    scheduleDue(now);
    if (now >= start + 4 * beatSec + lat + 0.4) { finishRound(); return; }
    var v = now - lat, modelEnd = base + 4 * beatSec, tapEnd = start + 4 * beatSec, d;
    if (v < modelEnd - 1e-9) {
      state = "model"; setLead("おてほんを きいてね", false);
      if (v >= base - 1e-9) {
        setActive(ONPU.rhythm.cardIndexAt(pattern, bpm, v - base));
        for (var k = 0; k < modelTl.hits.length; k++) { if (v + 1e-9 >= modelTl.hits[k] && dotEls[k]) { dotEls[k].classList.add("model"); } }
      } else { setActive(-1); }
    } else if (v < start - 1e-9) {
      state = "count"; setActive(-1);
      for (d = 0; d < dotEls.length; d++) { dotEls[d].classList.remove("model"); }
      var n = Math.floor((v - modelEnd + 1e-9) / beatSec) + 1; n = Math.max(1, Math.min(4, n));
      setLead(String(n), true);
    } else {
      state = "tap";
      for (d = 0; d < dotEls.length; d++) { dotEls[d].classList.remove("model"); }
      if (V[variant].num && v < tapEnd - 1e-9) {
        var m = Math.floor((v - start + 1e-9) / beatSec) + 1; m = Math.max(1, Math.min(4, m));
        setLead("たたいて！", false, m);
      } else {
        setLead("たたいて！", false);
      }
      setActive(v < tapEnd - 1e-9 ? ONPU.rhythm.cardIndexAt(pattern, bpm, v - start) : -1);
    }
    rafId = requestAnimationFrame(tick2);
  }

  function startPlayback() {
    stopRound();
    var now = ONPU.audio.now();
    if (now === null) { return; }
    var info = ONPU.audio.getLatency();
    lat = info ? ONPU.rhythm.latencyFrom(info.base, info.output) : 0;
    pattern = PATTERNS[qIndex];
    bpm = ONPU.rhythm.SPEEDS[speedKey]; beatSec = 60 / bpm;
    base = now + 0.3; start = base + 8 * beatSec;
    modelTl = ONPU.rhythm.timeline(pattern, bpm, base);
    queue = [];
    for (var i = 0; i < modelTl.hits.length; i++) { queue.push({ time: modelTl.hits[i], done: false }); }
    // 拍の音は見本だけの音の部品で、本番の音の時計に合わせて予約する（2つの時計の差 off を足す）
    var off = tctx.currentTime - now;
    var C6 = ONPU.music.noteToFrequency("C6"), C5 = ONPU.music.noteToFrequency("C5");
    var vv = V[variant];
    for (var k = 0; k < 4; k++) {
      if (vv.model > 0) { tick(k === 0 ? C6 : C5, base + k * beatSec + off, vv.model); }
      tick(k === 0 ? C6 : C5, base + (4 + k) * beatSec + off, 1.0);
      if (vv.tap > 0) { tick(k === 0 ? C6 : C5, start + k * beatSec + off, vv.tap); }
    }
    taps = []; state = "model";
    scheduleDue(now);
    rafId = requestAnimationFrame(tick2);
  }

  function goNext() {
    stopRound();
    qIndex = (qIndex + 1) % PATTERNS.length;
    renderPattern();
    autoId = setTimeout(function () { autoId = null; startPlayback(); }, 600);
  }

  function selectVariant(v) {
    variant = v;
    var tabs = document.querySelectorAll("#sbar .tab");
    for (var i = 0; i < tabs.length; i++) { tabs[i].classList.toggle("on", tabs[i].dataset.v === v); }
    $("sdesc").textContent = DESC[v];
    scaleStage();
    if ($("cover").hidden) { stopRound(); autoId = setTimeout(function () { autoId = null; startPlayback(); }, 600); }
  }

  function init() {
    scaleStage(); window.addEventListener("resize", scaleStage);
    $("btn-rhythm-speed").textContent = "はやさ：" + SPEED_TEXT[speedKey];
    renderPattern();
    var tabs = document.querySelectorAll("#sbar .tab");
    for (var i = 0; i < tabs.length; i++) { (function (t) { t.addEventListener("click", function () { selectVariant(t.dataset.v); }); })(tabs[i]); }
    bind("btn-cover", function () {
      ONPU.audio.unlock();
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        tctx = new AC(); tmaster = tctx.createGain(); tmaster.gain.value = 0.8; tmaster.connect(tctx.destination);
        if (tctx.resume) { tctx.resume(); }
      } catch (e) { tctx = null; }
      $("cover").hidden = true;
      autoId = setTimeout(function () { autoId = null; startPlayback(); }, 600);
    });
    bind("btn-rhythm-model", function () { startPlayback(); });
    bind("btn-rhythm-speed", function () { speedKey = SPEED_ORDER[(SPEED_ORDER.indexOf(speedKey) + 1) % 3]; $("btn-rhythm-speed").textContent = "はやさ：" + SPEED_TEXT[speedKey]; startPlayback(); });
    bind("flow-btn-1", goNext);
    var don = $("btn-rhythm-don");
    don.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button !== 0) { return; }
      e.preventDefault(); don.classList.add("pressed"); ONPU.audio.playDrum();
      if (state === "count" || state === "tap") { var t = ONPU.audio.now(); if (t !== null) { var rel = t - start; if (rel >= -0.5 * beatSec) { taps.push(rel); } } }
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { don.addEventListener(ev, function () { don.classList.remove("pressed"); }); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") { stopRound(); } });
    selectVariant("B");
  }

  // 自動確認用（見本の中だけ）
  window.__sample = { get state() { return state; }, get start() { return start; }, get lat() { return lat; }, get ticks() { return tickNodes.length; }, get tctx() { return tctx; } };
  init();
})();
</script>
</body>
</html>
